spring:
  datasource:
    url: jdbc:h2:mem:agroconecta_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: agroconecta-clave-secreta-para-pruebas-automatizadas-2026
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.agroconecta: WARN
    org.hibernate: WARN
